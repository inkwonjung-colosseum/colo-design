<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>비교안 C — 화면이 몸통 · Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
<style>
/* 비교안 C: 미리보기가 몸통(1fr), 대화가 오른쪽 날개(380px, 접힘 가능).
   심판 불일치 항목 — 실측 게이트 뒤 결정. 채택 확정 아님. */
.stageapp { display:grid; grid-template-columns:264px minmax(0,1fr) 380px; height:100vh; overflow:hidden; }
.stageapp .rail { border-right:1px solid var(--line); }
.stageapp .wing { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--bg); }
.stagebar { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); font-size:13px; }
.stagebar .next { color:var(--muted); }
.stagebar .acts { margin-left:auto; display:flex; gap:6px; }
.stagetools { display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid var(--line-soft); font-size:12px; color:var(--muted); }
.stagebody { flex:1; display:flex; align-items:center; justify-content:center; background:var(--bg); min-height:0; }
.stageframe { width:min(920px,92%); height:86%; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
  display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:13px; }
.wing__head { padding:10px 14px; border-bottom:1px solid var(--line-soft); font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
.wing__scroll { flex:1; overflow:auto; padding:14px; min-height:0; }
.wing .composer { margin:8px 12px 14px; }
/* 레일 상단 '기다리는 것' 이벤트 줄 (C안) */
.rail-ev { display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border:0; border-radius:var(--r-sm);
  background:transparent; font:inherit; font-size:12.5px; color:var(--text-2); cursor:pointer; text-align:left; }
.rail-ev:hover { background:var(--panel-2); }
.rail-ev .m { margin-left:auto; font-size:11px; color:var(--faint); }
</style>
</head>
<body>
<div class="stageapp">
  <aside class="rail">
    <div class="rail__top">
      <span class="rail__brand"><img src="../../packages/web/public/colonova-icon.svg" alt="" onerror="this.style.display='none'"/>Colo Design</span>
      <span class="grow"></span>
      <button class="ibtn" title="사이드바 접기">⟨</button>
    </div>
    <button class="rail__new"><span style="color:var(--accent-ink)">＋</span> 새 대화 <span class="kbd">⌘N</span></button>
    <div class="rail__search">⌕ &nbsp;대화 · 화면 검색 <span class="kbd" style="margin-left:auto">⌘K</span></div>
    <nav class="tree">
      <div class="tree__label">기다리는 것</div>
      <button class="rail-ev"><span class="dot dot--ask"></span>장바구니 — 확인 대기<span class="m">4분</span></button>
      <button class="rail-ev"><span class="dot dot--live"></span>알림 설정 — 만드는 중<span class="m">27초</span></button>
      <button class="rail-ev"><span class="dot dot--done"></span>치워둔 작업 1건<span class="m">꺼내기</span></button>
      <div class="tree__label" style="margin-top:10px">프로젝트</div>
      <div class="tnode">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter">쇼</span><span class="tnode__name">쇼핑몰 프론트</span><span class="tnode__repo">team/shop-web</span></button>
        <div class="tnode__kids">
          <button class="leaf"><span class="dot dot--done"></span><span class="leaf__t">회원 관리 화면 세 상태</span><span class="leaf__meta">방금</span></button>
          <button class="leaf leaf--on"><span class="dot dot--live"></span><span class="leaf__t">결제 실패 플로우</span><span class="leaf__meta leaf__meta--live">작업 중</span></button>
          <button class="leaf"><span class="dot dot--ask"></span><span class="leaf__t">장바구니 빈 상태</span><span class="leaf__meta leaf__meta--ask">확인 대기</span></button>
        </div>
      </div>
      <button class="leaf leaf--add" style="margin-top:8px;padding-left:10px">＋ 새 프로젝트</button>
    </nav>
    <div class="rail__foot"><button class="who"><span class="letter" style="width:24px;height:24px">지</span> 지연</button><span class="grow"></span><button class="ibtn" title="설정">⚙</button></div>
  </aside>

  <div style="display:flex;flex-direction:column;min-width:0;min-height:0">
    <div class="stagebar">
      <span class="chip chip--warn">저장 안 함</span>
      <span class="next">다음은 저장입니다</span>
      <span class="acts">
        <button class="btn btn--ghost btn--sm">더 보기</button>
        <button class="btn btn--sm">저장</button>
        <button class="btn btn--primary btn--sm">개발자에게 넘기기</button>
      </span>
    </div>
    <div class="stagetools">
      <span>회원 관리 ▾</span><span>기본 · 비어 있음 · 오류</span>
      <span class="grow"></span><span>핀 · 폭 · 새 창</span>
      <span style="color:var(--accent-ink)">● 작업 중 · 14초</span>
    </div>
    <div class="stagebody"><div class="stageframe">무대 — 실제 앱이 떠 있는 바닥 (1fr, 창을 키우면 커지는 것은 화면)</div></div>
  </div>

  <div class="wing">
    <div class="wing__head">결제 실패 플로우 <span class="grow"></span><button class="ibtn" title="날개 접기">⟩</button></div>
    <div class="wing__scroll">
      <div class="msg msg--user"><div class="msg__log">❯ 카드 오류가 났을 때 보여줄 안내 화면을 만들어 줘.</div></div>
      <div class="msg"><div class="msg__body">결제 실패 화면을 만들고 있어요. 오류 종류별로 문구가 달라지게 세 상태로 나눴습니다.</div></div>
      <div class="tool"><button class="tool__head">▸ 도구 3개 — 화면 만들기 · 파일 읽기 · 새로고침</button></div>
    </div>
    <div class="composer"><div class="composer__in">메시지를 입력하세요…</div></div>
  </div>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
