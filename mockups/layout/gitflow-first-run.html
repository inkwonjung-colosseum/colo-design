<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>안 5 — 첫 사이클 마법사 · Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
<style>
/* ---- 안 5: 첫 사이클 마법사 — 토큰→첫 PR까지 4장의 전면 화면 ---- */
.wiz { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:48px 20px; }
.wiz__brand { font-family:var(--serif); font-size:15px; font-weight:700; color:var(--text-2); margin-bottom:34px; }
.wiz__steps { display:flex; align-items:center; gap:10px; margin-bottom:38px; }
.wiz__step { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--faint); }
.wiz__step .n { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-strong);
  display:inline-flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10.5px; }
.wiz__step.done { color:var(--ok); }
.wiz__step.done .n { border-color:var(--ok); background:var(--ok-soft); }
.wiz__step.now { color:var(--text); font-weight:600; }
.wiz__step.now .n { border-color:var(--accent); background:var(--accent); color:#fff; }
.wiz__sep { width:26px; height:1.5px; background:var(--line-strong); }
.wiz__card { width:100%; max-width:560px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:30px 32px; box-shadow:var(--shadow-card); }
.wiz__title { font-family:var(--serif); font-size:22px; font-weight:700; margin:0 0 8px; }
.wiz__sub { font-size:13.5px; color:var(--muted); line-height:1.6; margin:0 0 20px; }
.repo { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:13px 14px; margin-bottom:8px; background:var(--panel); border:1.5px solid var(--line);
  border-radius:var(--r-md); font:inherit; cursor:pointer; transition:border-color .15s; }
.repo:hover { border-color:var(--line-strong); }
.repo.sel { border-color:var(--accent); background:var(--accent-soft); }
.repo .radio { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line-strong); flex:none; }
.repo.sel .radio { border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 3px var(--panel); }
.repo__body { flex:1; min-width:0; }
.repo__name { font-size:14px; font-weight:600; font-family:var(--mono); }
.repo__desc { font-size:12.5px; color:var(--muted); margin-top:2px; }
.wiz__foot { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
.wiz__help { margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft);
  font-size:12.5px; color:var(--muted); line-height:1.6; }
</style>
</head>
<body>
<div class="wiz">
  <div class="wiz__brand">◐ Colo Design</div>

  <!-- 여정 전체가 보인다: 4장, 지금 2장째 -->
  <div class="wiz__steps">
    <span class="wiz__step done"><span class="n">✓</span>토큰 연결</span>
    <span class="wiz__sep"></span>
    <span class="wiz__step now"><span class="n">2</span>레포 고르기</span>
    <span class="wiz__sep"></span>
    <span class="wiz__step"><span class="n">3</span>첫 화면 만들기</span>
    <span class="wiz__sep"></span>
    <span class="wiz__step"><span class="n">4</span>개발자에게 넘기기</span>
  </div>

  <div class="wiz__card">
    <h1 class="wiz__title">어떤 레포에 연결할까요?</h1>
    <p class="wiz__sub">방금 붙여넣은 토큰이 볼 수 있는 레포 3개를 찾았어요.<br/>화면을 만들 레포를 하나 골라 주세요.</p>

    <button class="repo sel">
      <span class="radio"></span>
      <div class="repo__body">
        <div class="repo__name">team/shop-web</div>
        <div class="repo__desc">쇼핑몰 프론트 · 마지막 작업 2일 전</div>
      </div>
    </button>
    <button class="repo">
      <span class="radio"></span>
      <div class="repo__body">
        <div class="repo__name">team/admin</div>
        <div class="repo__desc">관리자 콘솔 · 마지막 작업 어제</div>
      </div>
    </button>
    <button class="repo">
      <span class="radio"></span>
      <div class="repo__body">
        <div class="repo__name">company/landing</div>
        <div class="repo__desc">랜딩 페이지 · 마지막 작업 한 달 전</div>
      </div>
    </button>

    <div class="wiz__help">
      어느 레포인지 모르겠으면 개발자에게 <b>레포 이름</b>을 물어보세요 —
      "shop-web 같은 이름이에요"라고 들으면 됩니다.
    </div>

    <div class="wiz__foot">
      <button class="btn btn--quiet">← 뒤로</button>
      <button class="btn btn--primary" style="padding:9px 26px">계속</button>
    </div>
  </div>

  <p class="hint" style="margin-top:26px">이 안내는 첫 번째 넘기기가 반영되면 끝나고, 그다음부터는 평상시 화면이 뜹니다</p>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";
  try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}
}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
