<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>안 4 — 화면 보드 · Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
<style>
/* ---- 안 4: 화면 보드 — 제품의 화면이 목차, 상태가 카드에 붙는다 ---- */
.board { flex:1; overflow:auto; padding:22px 24px 60px; }
.board__grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
.scard { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
  overflow:hidden; cursor:pointer; transition:border-color .16s, transform .16s var(--drift); }
.scard:hover { border-color:var(--line-strong); transform:translateY(-1px); }
.scard__shot { aspect-ratio:4/3; background:var(--panel-3); position:relative;
  display:flex; align-items:center; justify-content:center; }
.scard__shot .fake { width:78%; height:70%; background:var(--panel); border:1px solid var(--line);
  border-radius:6px; padding:8px; }
.scard__shot .fake i { display:block; height:6px; border-radius:3px; background:var(--line-strong); margin-bottom:5px; }
.scard__shot .fake i.w40 { width:40% } .scard__shot .fake i.w70 { width:70% } .scard__shot .fake i.w55 { width:55% }
.scard__body { padding:10px 12px 12px; }
.scard__name { font-size:13.5px; font-weight:600; }
.scard__state { display:flex; align-items:center; gap:6px; margin-top:5px; font-size:12px; color:var(--muted); }
.scard--new { border-style:dashed; border-color:var(--line-strong); background:transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  min-height:180px; color:var(--muted); }
.scard--new:hover { color:var(--accent-ink); border-color:var(--accent-line); }
.scard--new .plus { font-size:26px; }
/* 프로젝트 띠 — 저장/넘기기는 카드가 아니라 프로젝트 것 */
.projstrip { display:flex; align-items:center; gap:10px; padding:10px 14px; margin:0 0 18px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-md); font-size:13px; }
.projstrip .next { color:var(--muted); }
.projstrip .acts { margin-left:auto; display:flex; gap:8px; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail__top">
      <span class="rail__brand">◐ Colo Design</span>
      <span class="grow"></span>
      <button class="ibtn" title="사이드바 접기">⟨</button>
    </div>
    <nav class="tree">
      <div class="tree__label">프로젝트</div>
      <div class="tnode">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter">쇼</span><span class="tnode__name">쇼핑몰 프론트</span><span class="tnode__repo">team/shop-web</span></button>
      </div>
      <div class="tnode closed">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter" style="background:var(--info-soft);color:var(--info)">관</span><span class="tnode__name">관리자 콘솔</span><span class="tnode__repo">team/admin</span></button>
      </div>
      <button class="leaf leaf--add" style="margin-top:8px;padding-left:10px">＋ 새 프로젝트</button>
    </nav>
    <div class="rail__foot"><button class="who"><span class="letter" style="width:24px;height:24px">지</span> 지연</button><span class="grow"></span><button class="ibtn" title="설정">⚙</button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__title">쇼핑몰 프론트</span>
      <span class="topbar__crumb">화면들</span>
      <span class="grow"></span>
      <span class="conn conn--ok"><span class="dot"></span>연결됨</span>
    </header>

    <div class="board">
      <!-- 저장·넘기기는 프로젝트 띠 — 카드 메뉴가 아니다 (스코프 계약 유지) -->
      <div class="projstrip">
        <span class="chip chip--warn">저장 안 함</span>
        <span class="next">화면 2개에 담기지 않은 변경이 있어요</span>
        <div class="acts">
          <button class="btn btn--sm btn--ghost">무엇이 달라졌나</button>
          <button class="btn btn--sm btn--primary">저장하기</button>
        </div>
      </div>

      <div class="board__grid">
        <button class="scard scard--new">
          <span class="plus">＋</span>
          <span>새 화면 만들기</span>
        </button>

        <button class="scard">
          <div class="scard__shot"><div class="fake"><i class="w40"></i><i class="w70"></i><i class="w55"></i><i class="w70"></i></div></div>
          <div class="scard__body">
            <div class="scard__name">로그인</div>
            <div class="scard__state"><span class="dot dot--done"></span>반영됨 · 어제</div>
          </div>
        </button>

        <button class="scard" style="border-color:var(--warn-line)">
          <div class="scard__shot"><div class="fake"><i class="w55"></i><i class="w70"></i><i class="w40"></i></div></div>
          <div class="scard__body">
            <div class="scard__name">장바구니</div>
            <div class="scard__state" style="color:var(--warn)"><span class="dot dot--ask"></span>저장 안 함 · 확인 요청</div>
          </div>
        </button>

        <button class="scard">
          <div class="scard__shot"><div class="fake"><i class="w70"></i><i class="w40"></i><i class="w70"></i><i class="w55"></i></div></div>
          <div class="scard__body">
            <div class="scard__name">회원 관리</div>
            <div class="scard__state" style="color:var(--info)"><span class="dot" style="background:var(--info)"></span>개발자 검토 중</div>
          </div>
        </button>

        <button class="scard">
          <div class="scard__shot"><div class="fake"><i class="w40"></i><i class="w55"></i><i class="w70"></i></div></div>
          <div class="scard__body">
            <div class="scard__name">결제</div>
            <div class="scard__state"><span class="dot dot--live"></span>고치는 중 · 1분 42초</div>
          </div>
        </button>
      </div>

      <p class="hint" style="text-align:center;margin-top:26px">화면을 열면 그 화면의 대화와 미리보기가 뜹니다 — 대화는 화면의 속성</p>
    </div>
  </div>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";
  try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}
}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
