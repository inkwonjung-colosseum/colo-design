<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>사용량 — Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
<style>
/* usage-dashboard: 사용량 전용 화면 — 이 페이지 전용 */
.ud-wrap { max-width: 880px; margin: 0 auto; padding: 48px 28px 80px; }
.ud-title { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
.ud-lede { color: var(--muted); font-size: 13.5px; margin: 0 0 30px; }
.ud-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .ud-grid { grid-template-columns: 1fr; } }
.ud-card {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--panel);
  padding: 20px 22px;
  box-shadow: var(--shadow-card);
}
.ud-card--wide { grid-column: 1 / -1; }
.ud-card__label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; }
/* 큰 링 — 이번 5시간 */
.ud-hero { display: flex; align-items: center; gap: 22px; }
.ud-bigring {
  width: 108px;
  height: 108px;
  position: relative;
  flex: none;
}
.ud-bigring__ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(var(--warn) 0 87%, var(--line-soft) 87% 100%);
  -webkit-mask: radial-gradient(circle, transparent 34px, #000 35px);
  mask: radial-gradient(circle, transparent 34px, #000 35px);
}
.ud-bigring__num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 700;
}
.ud-hero__body { min-width: 0; }
.ud-hero__state { font-size: 15px; font-weight: 600; color: var(--warn); }
.ud-hero__line { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.6; }

/* 주간 바 */
.ud-week__pct { font-family: var(--serif); font-size: 26px; font-weight: 700; }
.ud-week__bar { height: 7px; border-radius: 4px; background: var(--panel-3); overflow: hidden; margin: 12px 0 8px; }
.ud-week__bar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); width: 41%; }

/* 대화별 표 */
.ud-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ud-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--faint);
  padding: 0 0 8px;
  border-bottom: 1px solid var(--line-soft);
}
.ud-table th:last-child, .ud-table td:last-child { text-align: right; }
.ud-table td { padding: 10px 0; border-bottom: 1px solid var(--line-soft); color: var(--text-2); }
.ud-table tr:last-child td { border-bottom: 0; }
.ud-table .nm { color: var(--text); font-weight: 550; }
.ud-table .num { font-family: var(--mono); font-size: 12px; }

/* 모델별 스택 바 */
.ud-stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 14px; }
.ud-stack i { display: block; height: 100%; }
.ud-stack .s1 { width: 62%; background: var(--accent); }
.ud-stack .s2 { width: 31%; background: var(--info); }
.ud-stack .s3 { width: 7%; background: var(--line-strong); }
.ud-legend { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--text-2); }
.ud-legend__row { display: flex; align-items: center; gap: 8px; }
.ud-legend__sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.ud-legend__pct { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="ud-wrap">
  <h1 class="ud-title">사용량</h1>
  <p class="ud-lede">이 앱에서 쓴 만큼을 모아 보여 드려요. 정확한 청구액은 제공사 화면에서 확인하세요.</p>

  <div class="ud-grid">
    <!-- ============ 이번 5시간 ============ -->
    <div class="ud-card">
      <div class="ud-card__label">이번 5시간</div>
      <div class="ud-hero">
        <div class="ud-bigring"><span class="ud-bigring__ring"></span><span class="ud-bigring__num">87%</span></div>
        <div class="ud-hero__body">
          <div class="ud-hero__state">거의 찼어요</div>
          <div class="ud-hero__line">리셋 14:32<br/>지금 페이스면 40분 뒤 가득 찹니다</div>
        </div>
      </div>
    </div>

    <!-- ============ 이번 주 ============ -->
    <div class="ud-card">
      <div class="ud-card__label">이번 주</div>
      <div class="ud-week__pct">41%</div>
      <div class="ud-week__bar"><i></i></div>
      <span class="hint">리셋 금요일 · 아직 여유 있어요</span>
    </div>

    <!-- ============ 대화별 ============ -->
    <div class="ud-card ud-card--wide">
      <div class="ud-card__label">대화별</div>
      <table class="ud-table">
        <thead>
          <tr><th>대화</th><th>토큰</th><th>비용 추정</th></tr>
        </thead>
        <tbody>
          <tr><td class="nm">회원 관리 화면 세 상태</td><td class="num">412k</td><td class="num">₩1,840</td></tr>
          <tr><td class="nm">결제 실패 플로우</td><td class="num">268k</td><td class="num">₩1,190</td></tr>
          <tr><td class="nm">장바구니 빈 상태</td><td class="num">97k</td><td class="num">₩430</td></tr>
          <tr><td class="nm">관리자 콘솔 권한 표</td><td class="num">54k</td><td class="num">₩240</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ============ 모델별 ============ -->
    <div class="ud-card ud-card--wide">
      <div class="ud-card__label">모델별</div>
      <div class="ud-stack"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
      <div class="ud-legend">
        <div class="ud-legend__row"><span class="ud-legend__sw" style="background:var(--accent)"></span>소넷 4.5<span class="ud-legend__pct">62%</span></div>
        <div class="ud-legend__row"><span class="ud-legend__sw" style="background:var(--info)"></span>GPT-5<span class="ud-legend__pct">31%</span></div>
        <div class="ud-legend__row"><span class="ud-legend__sw" style="background:var(--line-strong)"></span>하이쿠<span class="ud-legend__pct">7%</span></div>
      </div>
    </div>
  </div>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
