<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>반영됨 — Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail__top">
      <span class="rail__brand"><img src="../../packages/web/public/colonova-icon.svg" alt="" onerror="this.style.display='none'"/>Colo Design</span>
      <span class="grow"></span>
      <button class="ibtn" title="사이드바 접기">⟨</button>
    </div>
    <button class="rail__new"><span style="color:var(--accent-ink)">＋</span> 새 대화 <span class="kbd">⌘N</span></button>
    <div class="rail__search">⌕ &nbsp;대화 · 화면 검색 <span class="kbd" style="margin-left:auto">⌘K</span></div>
    <nav class="tree">
      <div class="tree__label">프로젝트</div>
      <div class="tnode">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter">쇼</span><span class="tnode__name">쇼핑몰 프론트</span><span class="tnode__repo">team/shop-web</span></button>
        <div class="tnode__kids">
          <button class="leaf on"><span class="dot dot--done"></span><span class="leaf__t">회원 관리 화면 세 상태</span><span class="leaf__meta">반영됨</span></button>
          <button class="leaf"><span class="dot"></span><span class="leaf__t">주문 내역 표 다듬기</span><span class="leaf__meta">어제</span></button>
        </div>
      </div>
    </nav>
    <div class="rail__foot"><button class="who"><span class="letter" style="width:24px;height:24px">지</span> 지연</button><span class="grow"></span><button class="ibtn" title="설정">⚙</button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__title">회원 관리 화면 세 상태</span>
      <span class="topbar__crumb">쇼핑몰 프론트</span>
      <span class="grow"></span>
      <span class="conn conn--ok"><span class="dot"></span>연결됨</span>
    </header>

    <div class="work">
      <section class="chat">
        <div class="chat__scroll"><div class="chat__col">
          <div class="turn-ai">
            <div class="turn-ai__prose">
              <p><strong>개발자가 이 작업을 반영했습니다.</strong> 사이클이 한 바퀴 돌았습니다 — 다음 저장부터는 새 작업으로 시작합니다.</p>
            </div>
            <div class="turn-ai__meta"><span class="hint" style="margin-left:4px">방금 · 요청 42번 반영됨</span></div>
          </div>
        </div></div>
        <div class="composer-wrap">
          <div class="composer">
            <textarea class="composer__input" rows="1" placeholder="다음 화면을 시켜 보세요 — 새 사이클이 시작됩니다"></textarea>
            <div class="composer__bar">
              <button class="ibtn" title="그림 첨부">＋</button>
              <button class="composer__model">소네트 4.5 ▾</button>
              <span class="spacer"></span>
              <button class="send" title="보내기 · Enter">↑</button>
            </div>
          </div>
          <div class="sugg" style="margin-top:10px">
            <button class="chip">주문 내역 화면도 같은 결로 다듬어 줘</button>
            <button class="chip">회원 초대 모달 만들어 줘</button>
          </div>
        </div>
      </section>

      <section class="preview">
        <div class="cycle">
          <div class="cycle__steps">
            <span class="dchip dchip--ok"><span class="g">✓</span>반영됨</span>
            <span class="hint" style="align-self:center">요청 42번 · minho가 병합</span>
          </div>
          <div class="cycle__actions">
            <button class="btn btn--ghost btn--sm">최신 변경 받아오기</button>
          </div>
        </div>
        <div class="pbar">
          <div class="seg"><button>모바일</button><button class="on">데스크톱</button></div>
          <div class="pbar__url"><span>/members</span></div>
        </div>
        <div class="stage">
          <div class="stage__frame">
            <div class="stage__chrome"><i></i><i></i><i></i></div>
            <div class="stage__body">
              <div class="fakeapp">
                <div class="fakeapp__head"><div class="fakeapp__title">회원 관리</div><div class="fakeapp__desc">반영된 화면 — 회사 저장소의 최신 상태</div></div>
                <div class="fakeapp__table">
                  <div class="fakeapp__row"><span class="fakeapp__ava">김</span><div class="fakeapp__cell"><div class="a">김도현</div><div class="b">kim@shop.kr</div></div><span class="fakeapp__badge">관리자</span></div>
                  <div class="fakeapp__row"><span class="fakeapp__ava">이</span><div class="fakeapp__cell"><div class="a">이서윤</div><div class="b">lee@shop.kr</div></div><span class="fakeapp__badge fakeapp__badge--off">회원</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- ============ 종착의 한 박자: 토스트 ============ -->
<div class="toast">
  <span class="dot dot--done"></span>
  <div>
    개발자가 이 작업을 반영했습니다.
    <div class="toast__list">요청 42번 · 회원 관리 화면 세 상태 추가</div>
  </div>
  <button class="btn btn--quiet btn--sm">닫기</button>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
