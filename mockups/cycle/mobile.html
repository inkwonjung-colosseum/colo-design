<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모바일 뷰포트 — Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail__top">
      <span class="rail__brand"><img src="../../packages/web/public/colonova-icon.svg" alt="" onerror="this.style.display='none'"/>Colo Design</span>
      <span class="grow"></span>
      <button class="ibtn" title="사이드바 접기">⟨</button>
    </div>
    <button class="rail__new"><span style="color:var(--accent-ink)">＋</span> 새 대화 <span class="kbd">⌘N</span></button>
    <div class="rail__search">⌕ &nbsp;대화 · 화면 검색 <span class="kbd" style="margin-left:auto">⌘K</span></div>
    <nav class="tree">
      <div class="tree__label">프로젝트</div>
      <div class="tnode">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter">쇼</span><span class="tnode__name">쇼핑몰 프론트</span><span class="tnode__repo">team/shop-web</span></button>
        <div class="tnode__kids">
          <button class="leaf on"><span class="dot dot--done"></span><span class="leaf__t">회원 관리 화면 세 상태</span><span class="leaf__meta">방금</span></button>
        </div>
      </div>
    </nav>
    <div class="rail__foot"><button class="who"><span class="letter" style="width:24px;height:24px">지</span> 지연</button><span class="grow"></span><button class="ibtn" title="설정">⚙</button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__title">회원 관리 화면 세 상태</span>
      <span class="topbar__crumb">쇼핑몰 프론트</span>
      <span class="grow"></span>
      <span class="conn conn--ok"><span class="dot"></span>연결됨</span>
    </header>

    <div class="work">
      <section class="chat">
        <div class="chat__scroll"><div class="chat__col">
          <div class="turn-user"><div class="turn-user__bubble">모바일에서도 잘 보이는지 확인해 줘.</div></div>
          <div class="turn-ai"><div class="turn-ai__prose"><p>모바일 뷰포트로 바꿨습니다. 표가 가로 스크롤 없이 카드로 쌓이도록 했어요.</p></div></div>
        </div></div>
        <div class="composer-wrap">
          <div class="composer">
            <textarea class="composer__input" rows="1" placeholder="메시지를 보내 보세요"></textarea>
            <div class="composer__bar">
              <button class="ibtn" title="그림 첨부">＋</button>
              <button class="composer__model">소네트 4.5 ▾</button>
              <span class="spacer"></span>
              <button class="send" title="보내기 · Enter">↑</button>
            </div>
          </div>
        </div>
      </section>

      <section class="preview">
        <div class="pbar">
          <div class="seg"><button class="on">모바일</button><button>데스크톱</button></div>
          <div class="pbar__url"><span>/members</span></div>
          <button class="ibtn" title="새 창">↗</button>
          <button class="ibtn" title="코멘트 모드">✎</button>
        </div>
        <div class="row" style="padding:0 16px 10px;gap:6px">
          <button class="chip" style="border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)">기본</button>
          <button class="chip">비어 있음</button>
          <button class="chip">로딩</button>
          <button class="chip">오류</button>
        </div>

        <!-- ============ 모바일 프레임 ============ -->
        <div class="stage" style="align-items:center">
          <div class="stage__frame stage__frame--mobile">
            <div class="stage__chrome"><i></i><i></i><i></i></div>
            <div class="stage__body">
              <div class="fakeapp">
                <div class="fakeapp__head" style="padding:14px 16px 0"><div class="fakeapp__title" style="font-size:15px">회원 관리</div></div>
                <div class="fakeapp__table" style="padding:10px 14px 16px">
                  <div class="fakeapp__row"><span class="fakeapp__ava">김</span><div class="fakeapp__cell"><div class="a">김도현</div><div class="b">관리자 · 어제 가입</div></div></div>
                  <div class="fakeapp__row"><span class="fakeapp__ava">이</span><div class="fakeapp__cell"><div class="a">이서윤</div><div class="b">회원 · 3일 전</div></div></div>
                  <div class="fakeapp__row"><span class="fakeapp__ava">박</span><div class="fakeapp__cell"><div class="a">박건우</div><div class="b">회원 · 지난주</div></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="pins"><span class="hint" style="align-self:center">390 × 844 — iPhone 14 크기</span></div>
      </section>
    </div>
  </div>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
