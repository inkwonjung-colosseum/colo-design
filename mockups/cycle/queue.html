<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>대기 줄 — Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail__top">
      <span class="rail__brand"><img src="../../packages/web/public/colonova-icon.svg" alt="" onerror="this.style.display='none'"/>Colo Design</span>
      <span class="grow"></span>
      <button class="ibtn" title="사이드바 접기">⟨</button>
    </div>
    <button class="rail__new"><span style="color:var(--accent-ink)">＋</span> 새 대화 <span class="kbd">⌘N</span></button>
    <div class="rail__search">⌕ &nbsp;대화 · 화면 검색 <span class="kbd" style="margin-left:auto">⌘K</span></div>
    <nav class="tree">
      <div class="tree__label">프로젝트</div>
      <div class="tnode">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter">쇼</span><span class="tnode__name">쇼핑몰 프론트</span><span class="tnode__repo">team/shop-web</span></button>
        <div class="tnode__kids">
          <button class="leaf on"><span class="dot dot--live"></span><span class="leaf__t">결제 실패 플로우</span><span class="leaf__meta leaf__meta--live">작업 중</span></button>
        </div>
      </div>
    </nav>
    <div class="rail__foot"><button class="who"><span class="letter" style="width:24px;height:24px">지</span> 지연</button><span class="grow"></span><button class="ibtn" title="설정">⚙</button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__title">결제 실패 플로우</span>
      <span class="topbar__crumb">쇼핑몰 프론트</span>
      <span class="grow"></span>
      <span class="conn conn--ok"><span class="dot"></span>연결됨</span>
    </header>

    <div class="work work--chatonly">
      <section class="chat">
        <div class="chat__scroll"><div class="chat__col">
          <div class="turn-user"><div class="turn-user__bubble">결제 실패 화면을 만들어 줘.</div></div>
          <div class="turn-ai">
            <div class="act"><span class="ic"><span class="spin"></span></span> 화면 파일 2개 작업 · 검사 1회 실행</div>
          </div>
        </div></div>

        <div class="composer-wrap">
          <!-- 뒤에서 도는 작업 -->
          <div class="queued">
            <div class="queued__head">뒤에서 도는 작업 1건</div>
            <div class="qrow">
              <span class="qrow__text">화면 캡처 정리</span>
              <span class="qrow__act"><button class="ibtn" title="이 작업만 중지" style="width:22px;height:22px">✕</button></span>
            </div>
          </div>

          <!-- 다음 턴에 보낼 말 -->
          <div class="queued" style="border-top:1px solid var(--line-soft)">
            <div class="queued__head">다음 턴에 보냅니다 · 2건 대기</div>
            <div class="qrow">
              <span class="qrow__text">오류 상태에도 같은 버튼을 써 줘</span>
              <span class="qrow__act">
                <button class="btn btn--quiet btn--sm">고쳐서 보내기</button>
                <button class="btn btn--quiet btn--sm">지금 보내기</button>
              </span>
            </div>
            <div class="qrow">
              <span class="qrow__text">(첨부만)</span>
              <span class="qrow__meta">이미지 1장</span>
              <span class="qrow__act">
                <button class="btn btn--quiet btn--sm">고쳐서 보내기</button>
                <button class="btn btn--quiet btn--sm">지금 보내기</button>
              </span>
            </div>
          </div>

          <!-- 전달되지 못한 말 -->
          <div class="queued" style="border-top:1px solid var(--line-soft);background:var(--warn-soft)">
            <div class="queued__head" style="color:var(--warn)">전달되지 못한 말 1건 — 되살려 다시 보내 주세요</div>
            <div class="qrow">
              <span class="qrow__text">로딩 스피너 대신 뼈대 화면으로…</span>
              <span class="qrow__meta">첨부는 다시 붙여야 합니다</span>
              <span class="qrow__act">
                <button class="btn btn--quiet btn--sm">되살리기</button>
                <button class="ibtn" title="지우기" style="width:22px;height:22px">✕</button>
              </span>
            </div>
          </div>

          <div class="composer">
            <div class="composer__bar" style="padding-top:10px">
              <span class="spin"></span>
              <span class="hint" style="margin-left:6px">생각하는 중 · 1분 12초</span>
            </div>
            <textarea class="composer__input" rows="1" placeholder="도는 동안 보낸 말은 다음 턴의 줄에 섭니다"></textarea>
            <div class="composer__bar">
              <button class="ibtn" title="그림 첨부">＋</button>
              <button class="composer__model">소네트 4.5 ▾</button>
              <button class="composer__model" title="확인 방식">알아서 진행 ▾</button>
              <span class="spacer"></span>
              <button class="send send--stop" title="중지">■</button>
              <button class="send" title="다음 턴에 보내기 · Enter">↑</button>
            </div>
          </div>
          <p class="composer__hint">Enter — 다음 턴에 보내기 · ⌥Enter — 끊고 보내기</p>
        </div>
      </section>
    </div>
  </div>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
