<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>첨부 — Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
<style>
/* 첨부 — 이 페이지 전용 */
.at-attach{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.at-attach .turn-user__attach{padding:4px 10px 4px 4px}
.at-attach .thumb{width:26px;height:26px}
.at-x{width:22px;height:22px;font-size:10px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail__top">
      <span class="rail__brand"><img src="../../packages/web/public/colonova-icon.svg" alt="" onerror="this.style.display='none'"/>Colo Design</span>
      <span class="grow"></span>
      <button class="ibtn" title="사이드바 접기">⟨</button>
    </div>
    <button class="rail__new"><span style="color:var(--accent-ink)">＋</span> 새 대화 <span class="kbd">⌘N</span></button>
    <div class="rail__search">⌕ &nbsp;대화 · 화면 검색 <span class="kbd" style="margin-left:auto">⌘K</span></div>
    <nav class="tree">
      <div class="tree__label">프로젝트</div>
      <div class="tnode">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter">쇼</span><span class="tnode__name">쇼핑몰 프론트</span><span class="tnode__repo">team/shop-web</span></button>
        <div class="tnode__kids">
          <button class="leaf on"><span class="dot dot--done"></span><span class="leaf__t">회원 관리 화면 세 상태</span><span class="leaf__meta">방금</span></button>
          <button class="leaf"><span class="dot dot--live"></span><span class="leaf__t">결제 실패 플로우</span><span class="leaf__meta leaf__meta--live">작업 중</span></button>
          <button class="leaf"><span class="dot dot--ask"></span><span class="leaf__t">장바구니 빈 상태</span><span class="leaf__meta leaf__meta--ask">확인 대기</span></button>
        </div>
      </div>
      <div class="tnode closed">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter" style="background:var(--info-soft);color:var(--info)">관</span><span class="tnode__name">관리자 콘솔</span><span class="tnode__repo">team/admin</span></button>
      </div>
      <button class="leaf leaf--add" style="margin-top:8px;padding-left:10px">＋ 새 프로젝트</button>
    </nav>
    <div class="rail__foot"><button class="who"><span class="letter" style="width:24px;height:24px">지</span> 지연</button><span class="grow"></span><button class="ibtn" title="설정">⚙</button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__title">회원 관리 화면 세 상태</span>
      <span class="topbar__crumb">쇼핑몰 프론트</span>
      <span class="grow"></span>
      <span class="conn conn--ok"><span class="dot"></span>연결됨</span>
    </header>

    <div class="work">
      <section class="chat">
        <div class="chat__scroll"><div class="chat__col">
          <div class="turn-user"><div class="turn-user__bubble">회원 관리 화면을 만들어 줘. 목록·검색·권한 변경까지 있으면 좋겠어.</div></div>
        </div></div>
        <div class="composer-wrap">
          <div class="composer">
            <!-- 붙인 그림: 칩으로 보이고, 보내기 전엔 뺄 수 있습니다 -->
            <div class="at-attach">
              <span class="turn-user__attach"><span class="thumb"></span>레퍼런스-1.png<button class="ibtn at-x" title="첨부 빼기">✕</button></span>
              <span class="turn-user__attach"><span class="thumb"></span>레퍼런스-2.png<button class="ibtn at-x" title="첨부 빼기">✕</button></span>
            </div>
            <textarea class="composer__input" rows="1" placeholder="그림을 붙였습니다 — 어떻게 쓸지 한마디만 적어 주세요"></textarea>
            <div class="composer__bar">
              <button class="ibtn" title="그림 첨부">＋</button>
              <button class="composer__model">소네트 4.5 ▾</button>
              <button class="composer__model" title="확인 방식">알아서 진행 ▾</button>
              <span class="spacer"></span>
              <span class="hint" style="margin-right:8px">컨텍스트 18%</span>
              <button class="send" title="보내기 · Enter">↑</button>
            </div>
          </div>
          <p class="composer__hint">그림만 붙일 수 있습니다</p>
          <div class="sugg">
            <button class="chip">📎 붙여 시작하기 — 이걸 화면으로 만들어 줘</button>
          </div>
        </div>
      </section>

      <section class="preview">
        <div class="cycle">
          <div class="cycle__steps">
            <span class="cycle__step done"><span class="n">✓</span>만들기</span><span class="cycle__sep">→</span>
            <span class="cycle__step now"><span class="n">3</span>검토·수정</span><span class="cycle__sep">→</span>
            <span class="cycle__step"><span class="n">4</span>저장</span><span class="cycle__sep">→</span>
            <span class="cycle__step"><span class="n">5</span>넘기기</span>
          </div>
          <div class="cycle__actions">
            <button class="btn btn--ghost btn--sm">더 보기 ▾</button>
            <button class="btn btn--primary btn--sm">저장</button>
          </div>
        </div>
        <div class="pbar">
          <div class="seg"><button>모바일</button><button class="on">데스크톱</button></div>
          <div class="pbar__url"><span>/members</span></div>
          <button class="ibtn" title="새 창">↗</button>
          <button class="ibtn" title="코멘트 모드">✎</button>
        </div>
        <div class="stage">
          <div class="stage__frame">
            <div class="stage__chrome"><i></i><i></i><i></i></div>
            <div class="stage__body">
              <div class="stageempty">
                <div class="stageempty__mark">▦</div>
                <div>아직 만든 화면이 없습니다</div>
                <div class="hint">그림을 붙여내면 여기에 화면이 열립니다</div>
              </div>
            </div>
          </div>
        </div>
        <div class="pins"><span class="hint" style="align-self:center">상태 칩으로 화면 상태를 전환합니다</span></div>
      </section>
    </div>
  </div>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
document.querySelectorAll('.tool__head').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('open')));
</script>
</body>
</html>
