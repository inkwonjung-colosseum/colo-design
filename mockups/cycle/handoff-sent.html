<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>넘긴 뒤 — Colo Design 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
</head>
<body>
<div class="stagepage">
<div class="app">
  <aside class="rail">
    <div class="rail__top">
      <span class="rail__brand"><img src="../../packages/web/public/colonova-icon.svg" alt="" onerror="this.style.display='none'"/>Colo Design</span>
      <span class="grow"></span>
      <button class="ibtn" title="사이드바 접기">⟨</button>
    </div>
    <button class="rail__new"><span style="color:var(--accent-ink)">＋</span> 새 대화 <span class="kbd">⌘N</span></button>
    <div class="rail__search">⌕ &nbsp;대화 · 화면 검색 <span class="kbd" style="margin-left:auto">⌘K</span></div>
    <nav class="tree">
      <div class="tree__label">프로젝트</div>
      <div class="tnode">
        <button class="tnode__row"><span class="chev">▾</span><span class="letter">쇼</span><span class="tnode__name">쇼핑몰 프론트</span><span class="tnode__repo">team/shop-web</span></button>
        <div class="tnode__kids">
          <button class="leaf on"><span class="dot dot--done"></span><span class="leaf__t">회원 관리 화면 세 상태</span><span class="leaf__meta">방금</span></button>
        </div>
      </div>
    </nav>
    <div class="rail__foot"><button class="who"><span class="letter" style="width:24px;height:24px">지</span> 지연</button><span class="grow"></span><button class="ibtn" title="설정">⚙</button></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar__title">회원 관리 화면 세 상태</span>
      <span class="topbar__crumb">쇼핑몰 프론트</span>
      <span class="grow"></span>
      <span class="conn conn--ok"><span class="dot"></span>연결됨</span>
    </header>
    <div class="work">
      <section class="chat"><div class="chat__scroll"><div class="chat__col"></div></div></section>
      <section class="preview">
        <div class="cycle">
          <div class="cycle__steps">
            <span class="cycle__step done"><span class="n">✓</span>만들기</span><span class="cycle__sep">→</span>
            <span class="cycle__step done"><span class="n">✓</span>검토·수정</span><span class="cycle__sep">→</span>
            <span class="cycle__step done"><span class="n">✓</span>저장</span><span class="cycle__sep">→</span>
            <span class="cycle__step now"><span class="n">5</span>넘기기</span>
          </div>
          <div class="cycle__actions">
            <button class="btn btn--ghost btn--sm">상태 확인</button>
          </div>
        </div>
        <div class="stage"><div class="stage__frame"><div class="stage__chrome"><i></i><i></i><i></i></div><div class="stage__body"></div></div></div>
      </section>
    </div>
  </div>
</div>

<!-- ============ 넘긴 뒤: 요청이 열린 상태 ============ -->
<div class="scrim">
  <div class="modal" role="dialog" aria-label="개발자에게 넘기기" style="width:min(560px,calc(100vw - 48px))">
    <div class="modal__head">
      <span class="modal__title">개발자에게 넘기기</span>
      <span class="modal__dest">→ team/shop-web</span>
      <span class="grow"></span>
      <button class="ibtn" title="개발자에게 넘기기 닫기">✕</button>
    </div>
    <div class="modal__body">
      <div class="notice" style="background:var(--ok-soft);border-color:transparent">
        <span class="notice__text" style="color:var(--ok)">개발자에게 넘겼습니다</span>
      </div>

      <div class="prcard">
        <div class="prcard__head">
          <span class="prcard__title">회원 관리 화면 세 상태 추가</span>
          <span class="prstate prstate--open">넘김</span>
        </div>
        <div class="prcard__body" style="display:flex;gap:8px;align-items:center">
          <button class="btn btn--ghost btn--sm">↗ 넘긴 내용 열기</button>
          <button class="btn btn--ghost btn--sm">🔗 링크 복사</button>
        </div>
      </div>

      <p class="hint" style="margin:0">개발자 2명에게 갔습니다 · minho · seoyeon</p>
      <p class="hint" style="margin:0">개발자가 코멘트를 남기면 상태 확인에서 읽고 이어 갈 수 있습니다. 반영되면 다음 저장이 새 작업을 시작합니다.</p>
    </div>
    <div class="modal__foot">
      <button class="btn btn--primary">닫기</button>
    </div>
  </div>
</div>
</div>

<button class="themetoggle" onclick="toggleTheme()">◐ 테마 전환</button>
<script>
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("mockup-theme",h.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("mockup-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
