<!doctype html>
<!-- 「돌아왔을 때가 정점이다」
     이 화면은 자리를 비웠다 돌아온 순간의 랜딩 화면이다. 대화를 고르기 전,
     "나를 기다리는 일"이 결정이 필요한 순서대로 쌓여 있고, 카드 하나하나가
     곧장 그 대화로 이어진다 — 별도 대시보드가 아니라 대화 목록의 맨 앞칸. -->
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>지금 · 우리 팀 근태 앱 — 콜로 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="../mockup.css" />
<style>
  /* ── 뱃지 있는 벨(2단계 알림 위계: 헤더 뱃지) ────────────────────── */
  .bell { position: relative; }
  .bell__n {
    position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px;
    padding: 0 4px; border-radius: var(--r-pill); background: var(--accent);
    color: #fff; font-family: var(--mono); font-size: 9.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
  }

  /* ── 스크롤 본문 ──────────────────────────────────────────────── */
  .ret-work { flex: 1; display: block; min-height: 0; overflow: auto; background: var(--bg); }
  .ret-col { max-width: 660px; margin: 0 auto; padding: 34px 24px 90px; }

  /* ── 돌아온 순간 배너: 이 화면이 "정점"인 이유를 문장으로 못박는다 ── */
  .ret-back { margin-bottom: 22px; }
  .ret-back__eyebrow {
    font-size: 12px; font-weight: 600; color: var(--accent-ink); letter-spacing: .02em;
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
  }
  .ret-back__eyebrow .dot { width: 6px; height: 6px; }
  .ret-back__title {
    font-family: var(--serif); font-size: 25px; font-weight: 700; letter-spacing: -.01em;
    color: var(--text); margin-bottom: 5px;
  }
  .ret-back__sub { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
  .ret-recap { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .ret-recap span {
    font-size: 12px; color: var(--text-2); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r-pill); padding: 4px 11px;
  }

  /* ── 그룹 헤더 ────────────────────────────────────────────────── */
  .ret-glabel {
    display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: .02em; margin: 30px 2px 10px;
  }
  .ret-glabel:first-of-type { margin-top: 26px; }
  .ret-gcount { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .ret-gline { flex: 1; height: 1px; background: var(--line-soft); }

  /* ── 카드 ─────────────────────────────────────────────────────── */
  .ret-card {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 14px 16px; margin-bottom: 9px; cursor: pointer; transition: border-color .16s, box-shadow .16s;
  }
  .ret-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card); }
  .ret-card--ask { border-color: var(--warn-line); background: var(--warn-soft); }
  .ret-card--ask:hover { border-color: var(--warn); }
  .ret-card--quiet {
    background: transparent; border-color: transparent; border-bottom: 1px solid var(--line-soft);
    border-radius: 0; margin-bottom: 0; padding: 12px 4px;
  }
  .ret-card--quiet:hover { border-color: var(--line-soft); box-shadow: none; background: var(--panel-2); }

  .ret-row { display: flex; align-items: flex-start; gap: 11px; }
  .ret-row .dot { margin-top: 5px; flex: none; }
  .ret-body { min-width: 0; flex: 1; }
  .ret-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ret-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .ret-time { margin-left: auto; flex: none; font-size: 12px; color: var(--faint); }
  .ret-line { margin-top: 4px; font-size: 13px; color: var(--text-2); line-height: 1.55; }
  .ret-card--quiet .ret-name { font-weight: 500; color: var(--text-2); }
  .ret-card--quiet .ret-line { color: var(--muted); }

  .ret-quote {
    margin-top: 8px; padding: 8px 12px; border-left: 2px solid var(--warn); border-radius: 0 var(--r-sm) var(--r-sm) 0;
    background: var(--panel); font-size: 13px; color: var(--text); line-height: 1.55;
  }
  .ret-quick { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .ret-foot { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
  .ret-push {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--warn);
    margin-top: 8px;
  }
  .ret-run { margin-left: auto; flex: none; font-size: 12px; color: var(--accent-ink); }

  .ret-empty { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 26px; }
</style>
</head>
<body>

<div class="app">

  <!-- ══════════════ 왼쪽: 대화 목록 (Claude chat 그대로, 단일 레포) ══════════════ -->
  <aside class="rail">
    <div class="rail__top">
      <div class="rail__brand"><span class="letter" style="width:24px;height:24px;border-radius:7px;font-size:12px;">콜</span>콜로</div>
      <span class="grow"></span>
      <button class="ibtn bell" title="알림">
        🔔<span class="bell__n">2</span>
      </button>
    </div>
    <button class="rail__new">＋ 새 대화 <span class="kbd">⌘N</span></button>
    <div class="rail__search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      대화 검색
    </div>
    <nav class="tree">
      <div class="tree__label">오늘</div>
      <button class="leaf"><span class="dot dot--ask" style="margin-right:2px"></span><span class="leaf__t">휴가 신청 화면</span><span class="leaf__meta leaf__meta--ask">확인 필요</span></button>
      <button class="leaf"><span class="dot dot--ask" style="margin-right:2px"></span><span class="leaf__t">월급명세서 화면</span><span class="leaf__meta leaf__meta--ask">코멘트 도착</span></button>
      <button class="leaf"><span class="dot dot--live" style="margin-right:2px"></span><span class="leaf__t">근태 화면 고치기</span><span class="leaf__meta leaf__meta--live">작업 중</span></button>
      <button class="leaf"><span class="dot dot--live" style="margin-right:2px"></span><span class="leaf__t">회의실 예약 화면</span><span class="leaf__meta leaf__meta--live">작업 중</span></button>
      <button class="leaf"><span class="leaf__t">신규 입사자 온보딩 화면</span><span class="leaf__meta">저장됨</span></button>
      <div class="tree__label">어제</div>
      <button class="leaf"><span class="leaf__t">로그인 화면 문구 바꾸기</span><span class="leaf__meta">확인 중</span></button>
      <button class="leaf"><span class="leaf__t">관리자 화면 메뉴 줄이기</span><span class="leaf__meta">반영됨</span></button>
    </nav>
    <div class="rail__foot">
      <button class="who" style="flex:1;">
        <span class="letter">김</span>
        <span style="text-align:left;min-width:0;">
          <span style="display:block;font-size:12.5px;">김서연</span>
          <span style="display:block;font-size:11px;color:var(--faint);">우리 팀 근태 앱 · 연결됨</span>
        </span>
      </button>
      <button class="ibtn" title="설정">⚙</button>
    </div>
  </aside>

  <!-- ══════════════ 가운데: 돌아왔을 때 화면 ══════════════ -->
  <div class="main">
    <header class="topbar">
      <span class="topbar__title">지금</span>
      <span class="topbar__crumb">우리 팀 근태 앱</span>
      <span class="grow"></span>
      <span class="conn conn--ok"><span class="dot"></span>레포 연결됨</span>
    </header>

    <div class="ret-work">
      <div class="ret-col">

        <div class="ret-back">
          <div class="ret-back__eyebrow"><span class="dot dot--ask"></span>3시간 만에 돌아오셨어요</div>
          <div class="ret-back__title">그사이 이런 일이 있었어요</div>
          <div class="ret-back__sub">결정이 필요한 것부터 위에 뒀어요. 카드를 누르면 그 대화로 바로 들어가요.</div>
          <div class="ret-recap">
            <span>확인 필요 2건</span>
            <span>지금 만드는 중 2건</span>
            <span>오늘 저장됨 1건</span>
          </div>
        </div>

        <!-- ── 1단계: 나를 기다리는 일 — 결정 게이트가 최상단 고정 (Orca Agents feed / amux owner alert) ── -->
        <div class="ret-glabel">나를 기다리는 일 <span class="ret-gcount">2</span><span class="ret-gline"></span></div>

        <button class="ret-card ret-card--ask">
          <div class="ret-row">
            <span class="dot dot--ask"></span>
            <div class="ret-body">
              <div class="ret-top"><span class="ret-name">휴가 신청 화면</span><span class="ret-time">12분 전</span></div>
              <div class="ret-line">계속하려면 하나만 골라주시면 대화를 이어갈게요.</div>
              <div class="ret-quote">“반차도 하루짜리 신청과 같은 화면에 넣을까요, 따로 화면을 만들까요?”</div>
              <div class="ret-quick">
                <span class="chip">같은 화면에 넣기</span>
                <span class="chip">따로 만들기</span>
                <span class="chip">대화에서 답하기</span>
              </div>
              <div class="ret-push">📱 정말 막힌 대목이라 휴대폰으로도 알려드렸어요</div>
            </div>
          </div>
        </button>

        <button class="ret-card ret-card--ask">
          <div class="ret-row">
            <span class="dot dot--ask"></span>
            <div class="ret-body">
              <div class="ret-top"><span class="ret-name">월급명세서 화면</span><span class="ret-time">40분 전</span></div>
              <div class="ret-line">넘긴 화면에 준호 님이 코멘트를 남겼어요.</div>
              <div class="ret-quote">“표 아래 여백만 조금 줄여주세요. 나머지는 좋아요”</div>
              <div class="ret-foot"><span class="tag tag--warn">코멘트 도착</span><span class="btn btn--sm" style="margin-left:auto">대화에서 보기</span></div>
            </div>
          </div>
        </button>

        <!-- ── 2단계: 지금 진행 중 — 실행 중 항목은 조용히, 상단에 고정만 (Orca Agents feed) ── -->
        <div class="ret-glabel">지금 진행 중 <span class="ret-gcount">2</span><span class="ret-gline"></span></div>

        <button class="ret-card">
          <div class="ret-row">
            <span class="dot dot--live"></span>
            <div class="ret-body">
              <div class="ret-top"><span class="ret-name">근태 화면 고치기</span></div>
              <div class="ret-line">지각 사유를 적는 칸을 만드는 중이에요.</div>
            </div>
            <span class="ret-run">만드는 중 · 2분 10초</span>
          </div>
        </button>

        <button class="ret-card">
          <div class="ret-row">
            <span class="dot dot--live"></span>
            <div class="ret-body">
              <div class="ret-top"><span class="ret-name">회의실 예약 화면</span></div>
              <div class="ret-line">목록 보기를 달력 보기로 바꾸는 중이에요.</div>
            </div>
            <span class="ret-run">고치는 중 · 38초</span>
          </div>
        </button>

        <!-- ── 3단계: 방금 있었던 일 — 조용한 기록, 뱃지도 푸시도 없음 ── -->
        <div class="ret-glabel">방금 있었던 일 <span class="ret-gcount">3</span><span class="ret-gline"></span></div>

        <button class="ret-card ret-card--quiet">
          <div class="ret-row">
            <span class="dot dot--done"></span>
            <div class="ret-body">
              <div class="ret-top"><span class="ret-name">신규 입사자 온보딩 화면</span><span class="ret-time">오늘 오전 9:40</span></div>
              <div class="ret-line">저장 완료 — 화면 두 개가 앱에 담겼어요.</div>
            </div>
          </div>
        </button>

        <button class="ret-card ret-card--quiet">
          <div class="ret-row">
            <span class="dot dot--done"></span>
            <div class="ret-body">
              <div class="ret-top"><span class="ret-name">관리자 화면 메뉴 줄이기</span><span class="ret-time">어제</span></div>
              <div class="ret-line">반영됨 — 준호 님이 앱에 합쳤어요.</div>
            </div>
          </div>
        </button>

        <button class="ret-card ret-card--quiet">
          <div class="ret-row">
            <span class="dot" style="background:var(--info)"></span>
            <div class="ret-body">
              <div class="ret-top"><span class="ret-name">로그인 화면 문구 바꾸기</span><span class="ret-time">어제</span></div>
              <div class="ret-line">넘기기 완료 — 준호 님의 확인을 기다리고 있어요.</div>
            </div>
          </div>
        </button>

        <p class="ret-empty">여기까지예요. 새 일이 생기면 맨 위에 쌓아 둘게요.</p>
      </div>
    </div>
  </div>
</div>

<button class="themetoggle" id="themeBtn" title="테마 바꾸기">☾</button>

<script>
  const btn = document.getElementById('themeBtn');
  btn.addEventListener('click', () => {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    btn.textContent = next === 'dark' ? '☀' : '☾';
  });
</script>
</body>
</html>
