# electron-builder 설정(DESIGN §7).
#
# mac — 서명은 **필수**다. Electron 44 의 알림은 UNNotification 위에 있고, 그
# API 는 제대로 서명되지 않은 앱의 알림을 `failed`(UNErrorDomain 1)로 거절한다.
# 거절되는 것은 정확히 `linker-signed` 표식이 붙은 바이너리 — 서명을 건너뛴
# 빌드가 그대로 남기는 상태다. electron-builder 는 지정한 identity 를 찾지
# 못하면 경고 한 줄만 찍고 서명을 통째로 건너뛰므로(`forceCodeSigning` 이
# 없을 때), 그 조용한 길을 여기서 막는다: 서명 없는 설치 파일은 만들어지지
# 않는다.
#   identity  — 키체인의 자체 서명 인증서(CN "Colo Design Dev"). 인증서가 없는
#               기계·러너는 진짜 ad-hoc 서명으로 지어야 한다:
#               `electron-builder -c.mac.identity=-` (릴리스 워크플로가 그렇게
#               한다). ad-hoc 도 UNNotification 은 받아들인다 — 다만 빌드마다
#               cdhash 가 달라져 업데이트할 때마다 키체인(Safe Storage) 허용을
#               다시 묻는다. 안정된 identity 를 쓰는 이유가 그것이다.
# target: dmg(설치 배포) + zip(자가 업데이트가 내려받는 형태).
#
# win — NSIS 설치 파일(DESIGN §7). 이 머신에서는 빌드하지 않고 CI 의
# windows-latest 잡이 만든다 — 첫 실행에서 통과했다(PLAN M5.5). 설치 파일을
# 실제로 실행해 본 적은 아직 없다.
#
# extraResources — 포터블 런타임(DESIGN §7 런타임 번들). resources/bin 을
# PATH 앞에 붙이는 것은 메인 프로세스가 COLO_DESIGN_EXTRA_PATH 로 넘긴다.
appId: org.colo-design.desktop
productName: Colo Design
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - web-dist/**
  - package.json
  - "!**/*.map"
extraMetadata:
  # 패키지 버전이 앱 버전이다(업데이트 비교 기준).
  main: dist/main.js
asar: true
extraResources:
  # 빌드 머신의 포터블 node+corepack 번들(스크립트가 채운다). Windows 는
  # MinGit 도 여기에 들어간다(config-complete).
  - from: resources/bin
    to: bin
    filter: ["**/*"]
mac:
  identity: "Colo Design Dev"
  # 서명을 건너뛴 빌드는 여기서 실패한다 — 알림이 죽은 앱을 배포하지 않는다.
  # mac 에만 건다: Windows 잡은 인증서 없이 짓는다.
  forceCodeSigning: true
  # ad-hoc·자체 서명 + hardenedRuntime 조합은 library validation 때문에 실행이
  # 깨질 수 있다(공증 없이는 runtime 보호가 필수가 아니다) — 끈다.
  hardenedRuntime: false
  category: public.app-category.productivity
  # artifactName 은 mac 플랫폼 설정이 dmg·zip 모두에 적용된다(${ext} 로
  # 구분). 릴리스 URL(latest.json)이 이 이름을 그대로 쓰므로 명시적으로
  # 고정한다 — 빌더 기본값 변경과 무관하게 URL 이 깨지지 않는다.
  artifactName: colo-design-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # 공증 없음(사내 배포): notarize 기본 false.
win:
  target:
    - target: nsis
      arch: [x64]
  # v1 업데이트 흐름: 앱의 확인 버튼은 latest.json(릴리스 에셋)과 버전을
  # 비교해서 보여줄 뿐, 설치는 수동이다(mac 자가 교체 계획은 별개 모듈).
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 릴리스 URL 이 이름을 그대로 쓴다 — mac artifactName 과 같은 이유로 고정.
  artifactName: colo-design-Setup-${version}-win-${arch}.${ext}
  # SmartScreen "추가 정보 → 실행" 한 번은 설치 안내 페이지가 담당한다.
# v1 업데이트 흐름:
#   mac  — 앱이 직접 zip 다운로드·sha256 검증·교체(mac-self-update.ts).
#   win  — 설치 파일을 릴리스 페이지에서 수동 내려받는다(auto-update 없음).
