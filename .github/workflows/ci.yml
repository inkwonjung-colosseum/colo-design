# CDS Design 지속 검증 — 푸시·PR 마다 오프라인 전체 스위트를 돈다.
#
# 무엇을 막는가: 릴리스 워크플로우(desktop-release.yml)는 태그에만 걸려
# 있어, 깨진 테스트가 다음 릴리스 직전에야 발견되곤 했다(projects-e2e 의
# 미저장 변경 수 복원이 그렇게 한 달을 붉게 지냈다). 이 워크플로우는
# main 푸시와 모든 PR 에서 같은 스위트를 먼저 돌려 그 창을 없앤다.
#
# 무엇을 돌리는가: `pnpm test` 와 같은 네 레인 병렬 러너에서 real-Claude
# 두 스위트(test:daemon · test:planner — 구독 사용량을 쓰는 L4)만 뺀
# L1(단위·Electron) · L2(데몬 소켓 e2e) · L3(브라우저 e2e). 전부 로컬
# fixture(bare git 원격 · 스텁 CLI · 녹화된 GitHub REST)로 돌아가 외부
# 네트워크가 필요 없다. Electron 스위트는 ubuntu 에서 xvfb 로 뜬다.
#
# 실패한 경우: 레인별 로그(.test-logs/)를 아티팩트로 올려 웹 UI 로그에서
# 직접 읽을 수 있게 한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: 오프라인 스위트 (L1–L3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 루트 package.json 의 packageManager 필드가 결정한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 설치
        run: pnpm install --frozen-lockfile

      # 브라우저(e2e)와 Electron(L1 의 comments·smoke)이 ubuntu 에서 돌기
      # 위해 필요한 것을 한 번에: chromium 바이너리 + 시스템 라이브러리 +
      # xvfb(Electron 은 디스플레이 없이는 뜨지 않는다).
      - name: 브라우저·Electron 실행 환경
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb

      - name: 빌드
        run: pnpm build

      # Electron 의 linux 샌드박스는 root 소유 4755 인 SUID 헬퍼를 요구한다.
      # 러너의 node_modules 는 그렇지 않고, 헬퍼 파일은 electron 의 설치
      # 스크립트가 레인 실행 중에야 내려받으므로 미리 권한을 고쳐 둘 수도
      # 없다(그 시도가 두 번째 ci 실패였다). 이 스위트가 보는 것은 숨은 창 ·
      # 진짜 JPEG · 클릭이지 샌드박스 정책이 아니므로, CI 에서만 끈다.
      - name: 오프라인 레인 실행 (real-Claude L4 제외)
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          # 순차 실행: 공유 러너의 코어 수에서 3레인 병렬은 스스로 과부하를
          # 만들어 부하에 민감한 대기(화면 밖 턴의 카운트, 마법사의 이동)를
          # 플레이크시킨다. 각 레인은 이미 스위트를 순서대로 돌리고, 전체는
          # 여전히 여유(타임아웃 45분) 안에 든다.
          xvfb-run -a node scripts/test-parallel.mjs L1
          xvfb-run -a node scripts/test-parallel.mjs L2
          xvfb-run -a node scripts/test-parallel.mjs L3

      - name: 레인 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .test-logs/
          retention-days: 3
          # .test-logs 는 점으로 시작하는 숨김 디렉터리다 — 기본값은 이를
          # 건너뛰어 실패 원인이 사라진다. 숨김 파일도 싣는다.
          include-hidden-files: true
