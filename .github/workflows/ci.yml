# Colo Design 배포 검증 — main 푸시·PR 에서 "릴리스가 막히는 것"만 먼저 본다.
#
# 무엇을 돌리는가: 릴리스 워크플로우(desktop-release.yml)가 태그에서
# 돌리는 것과 같은 트리의 typecheck · build. 이 두 가지가 깨지면 에셋이
# 못 나오므로 태그를 밀기 전에 이 문에서 잡는다.
#
# 2026-09-21: 테스트 레인(L1·L2·L3·L5, 정적 검사)은 운영 판단으로
# 걷어냈다 — 러너(Linux)와 실제 배포 플랫폼(mac·Windows) 환경이 어긋나
# 제품이 아니라 러너를 탓하는 빨간 신호가 5일(릴리스 2건) 지속됐다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    name: 배포 검증 (typecheck·build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 루트 package.json 의 packageManager 필드가 결정한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 빌드 (릴리스와 같은 경로)
        run: pnpm build
