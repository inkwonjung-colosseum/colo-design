# 커밋은 빠르게: 스테이징된 파일의 포맷·린트만 고쳐 되돌려 놓는다.
pre-commit:
  commands:
    biome:
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,css}"
      # {staged_files} 는 삭제된 경로도 넘기고 biome 은 없는 파일을 읽다
      # internalError/io 로 죽는다 — 삭제 커밋을 영구히 막는다. 삭제(D)를 뺀
      # 목록을 직접 만든다.
      files: git diff --cached --name-only --diff-filter=ACMR
      run: pnpm exec biome check --write --no-errors-on-unmatched {files}
      stage_fixed: true

# 푸시 직전, CI 와 같은 문(배포 검증)을 한 번 더 로컬에서 지나간다.
# typecheck 단독은 깨끗한 체크아웃에서 protocol/dist 가 없어 실패한다 —
# 빌드가 위상 정렬로 같은 검증을 맡는다(릴리스와 같은 경로). knip 게이트는
# 걷었다(2026-09-21): 테스트가 진입점이었는데 스위트가 사라져 제품 export
# 전부가 '미사용'으로 보였다.
pre-push:
  parallel: true
  commands:
    build:
      run: pnpm -r build
